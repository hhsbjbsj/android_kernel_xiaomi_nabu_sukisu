name: Build and release nabu kernel

on:
  workflow_dispatch:
  push:
    branches:
      - 17.0_336-b1
      - main

jobs:
  build:
    name: Build nabu A17 Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free Disk Space and Setup 16GB Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl -w vm.swappiness=60
          free -h

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex gawk \
            git gnupg gperf imagemagick libncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            cmake libelf-dev libdw-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-nabu-${{ github.sha }}
          restore-keys: |
            ccache-nabu-

      - name: Cache pahole v1.25
        id: cache-pahole
        uses: actions/cache@v4
        with:
          path: ~/pahole
          key: pahole-v1.25-bin

      - name: Setup pahole v1.25
        if: steps.cache-pahole.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 -b v1.25 https://git.kernel.org/pub/scm/devel/pahole/pahole.git $HOME/pahole
          mkdir -p $HOME/pahole/build
          cd $HOME/pahole/build
          cmake -D__LIB=lib ..
          make -j$(nproc)
          ./pahole --version

      - name: Cache AOSP Clang r547379
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/toolchains/linux-x86/clang-r547379
          key: clang-r547379-toolchain

      - name: Setup AOSP Clang r547379
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains/linux-x86/clang-r547379
          git clone --depth=1 https://github.com/KiTTYsh/android_prebuilts_clang_host_linux-x86_clang-r547379 $HOME/toolchains/linux-x86/clang-r547379
          $HOME/toolchains/linux-x86/clang-r547379/bin/clang --version | head -1

      - name: Cache GCC 4.9 Toolchains
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: |
            ~/toolchains/aarch64-linux-android-4.9
            ~/toolchains/arm-linux-androideabi-4.9
          key: gcc-4.9-lineage-19.1-toolchain

      - name: Setup GCC 4.9 Toolchains
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/toolchains
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 $HOME/toolchains/aarch64-linux-android-4.9
          git clone --depth=1 -b lineage-19.1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 $HOME/toolchains/arm-linux-androideabi-4.9
          
          # Ensure aarch64-linux-androidkernel- aliases exist in bin directory
          cd $HOME/toolchains/aarch64-linux-android-4.9/bin
          for f in aarch64-linux-android-*; do
            target="${f/aarch64-linux-android-/aarch64-linux-androidkernel-}"
            if [ ! -e "$target" ]; then
              ln -s "$f" "$target"
            fi
          done

      - name: Sync and adapt latest BakaSU (ReSukiSU) main
        run: |
          chmod +x bk_build/sync_resukisu.sh
          ./bk_build/sync_resukisu.sh

      - name: Build Kernel and Package AnyKernel3
        run: |
          chmod +x bk_build/build.sh bk_build/pack.sh bk_build/build-module.sh
          export CLANG_DIR="$HOME/toolchains/linux-x86/clang-r547379"
          export GCC64_DIR="$HOME/toolchains/aarch64-linux-android-4.9"
          export GCC32_DIR="$HOME/toolchains/arm-linux-androideabi-4.9"
          export PAHOLE="$HOME/pahole/build/pahole"
          export DISABLE_LTO_CACHE=1
          export JOBS=$(nproc)
          export CCACHE=ccache
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CCACHE_MAXSIZE="5G"
          export KCFLAGS="-DEXPECTED_SIZE=0x039a -DEXPECTED_HASH=\\\"366aa724f4ed84d589fb47077cee4dc6aac45c37c4a50a6e1eaed4446bb3bc03\\\""
          export KSU_EXPECTED_SIZE="0x039a"
          export KSU_EXPECTED_HASH="366aa724f4ed84d589fb47077cee4dc6aac45c37c4a50a6e1eaed4446bb3bc03"
          export EXPECTED_SIZE="0x039a"
          export EXPECTED_HASH="366aa724f4ed84d589fb47077cee4dc6aac45c37c4a50a6e1eaed4446bb3bc03"
          ccache -s
          ./bk_build/build.sh
          ccache -s

      - name: Upload Kernel Packages and Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nabu-A17-kernel-artifacts
          path: |
            out/*/packages/*.zip
            out/*/artifacts/*
            out/*/module-artifacts/*

      - name: Create GitHub Release
        if: success() && github.ref == 'refs/heads/17.0_336-b1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PACKAGE=$(find out/*/packages -maxdepth 1 -type f \( -name 'bk-Kernel-ayin_nabu-A17-Hyper-Panz-*.zip' -o -name 'bk-Kernel_nabu-A17-Hyper-Panz-*.zip' \) | head -1)
          MODULE=$(find out/*/packages -maxdepth 1 -type f -name 'bkk-control-*.zip' | head -1)
          if [ -n "$PACKAGE" ] && [ -n "$MODULE" ]; then
            TAG="bk-Kernel_nabu-A17-Hyper-Panz-$(date -u +%Y%m%d-%H%M%S)"
            gh release create "$TAG" "$PACKAGE" "$MODULE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "bk-Kernel nabu A17 Hyper Panz (ReSukiSU + SUSFS 2.3.0 + bkk-control 1.3)" \
              --notes "Release for Xiaomi Pad 5 (nabu) on Android 17 / HyperOS 2.0 with ReSukiSU main, SUSFS 2.3.0, fixed LSPosed cold boot, and bkk-control 1.3." \
              --latest || echo "Release creation skipped or failed"
          fi

